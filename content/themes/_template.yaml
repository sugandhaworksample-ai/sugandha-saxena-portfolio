# ============================================================
# content/themes/_template.yaml
# ============================================================
# COPY this file to add a new look, e.g. ember.yaml
# Then:
#   1. Change id / label / description (id = filename without .yaml)
#   2. Tweak light: and dark: colors
#   3. Save and rebuild — it appears in the palette switcher
#
# Do NOT keep the leading underscore in a live theme filename.
# Files starting with _ are ignored by the theme loader.
# ============================================================

