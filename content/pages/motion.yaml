# ============================================================
# content/pages/motion.yaml
# ============================================================
# Controls everything on the Motion page (/motion).
#
# HERO SECTION
#   eyebrow  — tiny uppercase label above the H1 (e.g. "Motion")
#   headline — the big display heading
#   subtitle — paragraph below the heading
#
# ITEMS (showcase grid)
#   Each item becomes one card in the 3-column grid.
#   Fields per item:
#     title      — card heading (required)
#     subtitle   — small uppercase label above the heading
#     body       — description text below the heading
#     href       — if set, the whole card becomes a clickable link
#     videoUrl   — embed URL for a YouTube/Vimeo preview
#                  Example: "https://www.youtube.com/embed/VIDEO_ID"
#     image      — path to a thumbnail image in /public
#                  Example: "/motion/showreel-thumb.jpg"
#     tags       — list of tags (currently unused in the UI, for future filtering)
#
# TIP: Add your real showreel videos by setting videoUrl on each item.
# ============================================================

eyebrow: "Motion"
headline: "Frames that breathe"
subtitle: >
  Motion graphics, video edits, and animated campaigns — work made to move.

items:
  - title: "Bitli Brand Motion"
    subtitle: "Social Reels"
    body: >
      Animated brand content for Bitli — designed for Instagram and digital-first campaigns.
    href: "/projects/motion-and-video"
    tags:
      - motion
      - social

  - title: "KITS Product Video"
    subtitle: "Product"
    body: >
      Product video for KITS — kinetic motion with brand storytelling.
    href: "/projects/motion-and-video"
    tags:
      - product
      - video

  - title: "SIL Event Reel"
    subtitle: "Event"
    body: >
      Motion reel produced for SIL 2025 — capturing live environments and brand energy.
    href: "/projects/motion-and-video"
    tags:
      - event
      - reel

  - title: "Why Choose School"
    subtitle: "Education"
    body: >
      Motion graphic video for an education brand — clear messaging with visual storytelling.
    href: "/projects/motion-and-video"
    tags:
      - education
      - motion

  - title: "Showreel"
    subtitle: "Showreel"
    body: >
      Full creative showreel — a curated selection of motion, brand, and video work.
    href: "/projects/motion-and-video"
    tags:
      - showreel
      - motion

  - title: "All Motion Work"
    subtitle: "Gallery"
    body: >
      Browse all motion and video work — social reels, event films, product videos, and more.
    href: "/projects/motion-and-video"
    tags:
      - all

